<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mesclagem de tabelas </title>
    <style>
        td{
           border: 1px solid black;
        }
        table{
        border-collapse: collapse;
        width: 300px;
        }
        caption{
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h1>mesclagem de tabelas </h1>

    <table>
        <caption> comidas</caption>
           
        
        <tr>
            <td colspan="2">arroz</td>
            <td>10,99</td>
            <td>13.99</td>
            </tr>
            <tr>
            <td>feijao</td>
            <td rowspan="3">5,99</td>
            <td>peito de frango</td>
            </tr>
            
            <td>pao</td>
            <tr>
            
            <td>uva</td>
            </tr>
            
        

    </table>
</body>
</html>
