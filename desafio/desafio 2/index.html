<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>tags em html</h1>
    <h3>
        Em html 5, podemos usar inserir os elementos a seguir. Passe o mouse sobre os termos para descobrir qual tag deverar utilizar em cada caso
       </h3>
    
       <ul title="circo">
        <li title="tag de parágrafo <p>">Parágrafo</li>
        <li title="tag de link <a>">Link</li>
        <li title="tag de imagem <img>">Imagem</li>
        <li title="tag de lista ordenada <ol>">Lista ordenada</li>
        <li title="tag de lista não ordenada <ul>">Lista não ordenada</li>
        <li title="tag de tabela <table>">Tabela</li>
        <li title="tag de formulário <form>">Formulário</li>
        <li title="tag de abreviaçoes <abbr>" >Abreviação</li>
        <li title="tag de citação <blockquote>">Citação</li>
    </ul>

   
</body>

</html>
